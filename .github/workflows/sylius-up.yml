name: Init Sylius via Docker

on:
  push:
    branches:
      - development

jobs:
  setup-sylius:
    runs-on: ubuntu-latest

    steps:
    - name: Crear proyecto Sylius
      run: |
        docker run --rm -v ${{ github.workspace }}:/app composer create-project sylius/sylius-standard acme --ignore-platform-reqs --no-scripts --no-install

    - name: Corregir permisos
      run: sudo chown -R $USER:$USER ./acme

    - name: Inicializar Sylius
      working-directory: ./acme
      run: make init

    - name: Esperar a que Sylius esté disponible (desde dentro del contenedor)
      working-directory: ./acme
      run: |
        echo "Esperando a que Sylius esté listo dentro del contenedor PHP"
        for i in {1..30}; do
          if docker compose exec php php bin/console about; then
            echo "Sylius está listo 🚀"
            exit 0
          fi
          echo "Esperando..."
          sleep 5
        done
        echo "Timeout esperando a Sylius"
        exit 1

    - name: Probar endpoint base y API dentro del contenedor PHP
      working-directory: ./acme
      run: |
        docker compose exec php curl -I http://localhost
        docker compose exec php curl -I http://localhost/api/v2

    - name: Detener contenedores
      if: always()
      working-directory: ./acme
      run: docker compose down -v