name: Init Sylius via Docker

on:
  push:
    branches:
      - development

jobs:
  setup-sylius:
    runs-on: ubuntu-latest

    steps:
    - name: Crear proyecto Sylius
      run: |
        docker run --rm -v ${{ github.workspace }}:/app composer create-project sylius/sylius-standard acme --ignore-platform-reqs --no-scripts --no-install

    - name: Corregir permisos
      run: sudo chown -R $USER:$USER ./acme

    - name: Inicializar Sylius
      working-directory: ./acme
      run: make init

    - name: Esperar a que Sylius esté disponible (desde host)
      working-directory: ./acme
      run: |
        echo "Esperando a que Sylius esté disponible en http://localhost:8000/api/v2"
        for i in {1..30}; do
          if curl -s --head http://localhost:8000/api/v2 | grep "200 OK" > /dev/null; then
            echo "Sylius está listo 🚀"
            exit 0
          fi
          echo "Esperando..."
          sleep 5
        done
        echo "Timeout esperando a Sylius"
        exit 1

    - name: Probar login Sylius Admin
      working-directory: ./acme
      run: |
        echo "Probando login con sylius@example.com"
        for i in {1..10}; do
          RES=$(curl -s -w "%{http_code}" -o response.json -X POST http://localhost:8000/api/v2/admin/administrators/token \
            -H "Content-Type: application/json" \
            -d '{"email": "sylius@example.com", "password": "sylius"}')
          if [ "$RES" -eq 200 ]; then
            echo "✅ Login exitoso"
            cat response.json
            break
          fi
          echo "Esperando login... intento $i"
          sleep 3
        done

        if [ "$RES" -ne 200 ]; then
          echo "❌ Login fallido. Código de respuesta: $RES"
          cat response.json
          exit 1
        fi

    # Aquí puedes agregar el paso para correr tests

    - name: Detener contenedores
      if: always()
      working-directory: ./acme
      run: docker compose down -v