name: Levantar Sylius y listar endpoints

on:
  push:
    branches:
      - development  # Cambia por tu rama real si es necesario

jobs:
  levantar-y-listar:
    runs-on: ubuntu-latest

    steps:
      - name: Crear proyecto Sylius
        run: |
          docker run --rm -v ${{ github.workspace }}:/app composer create-project sylius/sylius-standard acme --ignore-platform-reqs --no-scripts --no-install

      - name: Corregir permisos
        run: sudo chown -R $USER:$USER ./acme

      - name: Inicializar Sylius
        working-directory: ./acme
        run: make init

      - name: Esperar que Sylius esté disponible
        working-directory: ./acme
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/v2 || echo 0)
            echo "Intento $i - Código: $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Sylius listo"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Timeout esperando Sylius"
          exit 1

      - name: Listar endpoints de la API
        working-directory: ./acme
        run: |
          curl http://localhost/api | jq '.paths | keys'

      - name: Detener contenedores
        if: always()
        working-directory: ./acme
        run: docker compose down -v