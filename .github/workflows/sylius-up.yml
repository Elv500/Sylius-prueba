name: Run Sylius API Tests with Docker

on:
  push:
    branches:
      - development

jobs:
  sylius-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Set up Docker Compose
      run: docker compose up -d

    - name: Wait for PHP container to be ready
      run: |
        until docker compose exec php php bin/console about; do
          echo "Esperando a que PHP esté listo..."
          sleep 5
        done

    - name: Limpiar cache Sylius para confirmar que funciona
      run: docker compose exec php php bin/console cache:clear

    # - name: Ejecutar pruebas con pytest
    #   run: |
    #     pytest tests/ --disable-warnings -v --alluredir=reports/allure-results

    # - name: Subir resultados Allure como artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: allure-results
    #     path: reports/allure-results

    # - name: Generar reporte HTML de Allure
    #   run: |
    #     allure generate reports/allure-results --clean -o reports/allure-report-html

    # - name: Subir reporte HTML como artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: allure-report-html
    #     path: reports/allure-report-html

    - name: Detener contenedores
      if: always()
      run: docker compose down -v