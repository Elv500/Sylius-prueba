name: Init Sylius via Docker

on:
  push:
    branches:
      - development

jobs:
  setup-sylius:
    runs-on: ubuntu-latest

    steps:
    - name: Crear proyecto Sylius
      run: |
        docker run --rm -v ${{ github.workspace }}:/app composer create-project sylius/sylius-standard acme --ignore-platform-reqs --no-scripts --no-install

    - name: Corregir permisos
      run: sudo chown -R $USER:$USER ./acme

    - name: Inicializar Sylius
      working-directory: ./acme
      run: make init

    - name: Esperar a que Sylius esté disponible (desde host)
      working-directory: ./acme
      run: |
        echo "Esperando a que Sylius esté disponible en http://localhost/api/v2"
        for i in {1..30}; do
          if curl -s --head http://localhost/api/v2 | grep "200 OK" > /dev/null; then
            echo "Sylius está listo 🚀"
            exit 0
          fi
          echo "Esperando..."
          sleep 5
        done
        echo "Timeout esperando a Sylius"
        exit 1

    - name: Probar endpoint base y API desde host
      working-directory: ./acme
      run: |
        curl -I http://localhost
        curl -I http://localhost/api/v2

    - name: Generar claves JWT si no existen
      working-directory: ./acme
      run: |
        if [ ! -f config/jwt/private.pem ]; then
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -aes256 -passout pass:ChangeMe 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:ChangeMe
        fi

    - name: Establecer passphrase JWT
      working-directory: ./acme
      run: |
        echo "JWT_PASSPHRASE=ChangeMe" >> $GITHUB_ENV

    - name: Probar login admin (api@example.com)
      working-directory: ./acme
      run: |
        echo "Probando login con api@example.com"
        RES=$(curl -s -w "%{http_code}" -o response.json -X POST http://localhost/api/v2/admin/administrators/token \
          -H "Content-Type: application/json" \
          -d '{"email": "api@example.com", "password": "sylius-api"}')

        if [ "$RES" -ne 200 ]; then
          echo "❌ Login fallido. Código de respuesta: $RES"
          cat response.json
          exit 1
        fi

        echo "✅ Login exitoso. Token:"
        cat response.json

    - name: Detener contenedores
      if: always()
      working-directory: ./acme
      run: docker compose down -v